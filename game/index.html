<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR BAY — Open-World Crime Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1c26;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #fff; }
  #app, #app canvas { position: fixed; inset: 0; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hidden { display: none !important; }
  .panel { pointer-events: auto; }
  #menu { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; text-align: center;
    background: linear-gradient(180deg, rgba(6,20,30,.82), rgba(6,20,30,.55) 45%, rgba(6,20,30,.85)); }
  #menu h1 { font-size: 64px; letter-spacing: 10px; color: #ffd84d;
    text-shadow: 0 4px 0 #b3541e, 0 8px 24px rgba(0,0,0,.6); }
  #menu .tag { font-size: 17px; color: #bfe3ff; letter-spacing: 1px; }
  #menu .story { max-width: 640px; font-size: 15px; line-height: 1.55; color: #e8eef2; }
  #menu .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 22px; max-width: 640px;
    font-size: 13px; color: #cfe3ef; text-align: left; background: rgba(0,0,0,.35);
    padding: 12px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); }
  #menu button { pointer-events: auto; cursor: pointer; font-size: 18px; font-weight: 700;
    letter-spacing: 1px; color: #14202a; background: #ffd84d; border: none; border-radius: 10px;
    padding: 14px 34px; box-shadow: 0 4px 0 #b3541e; }
  #menu button:active { transform: translateY(3px); box-shadow: none; }
  #menu button.ghost { background: transparent; color: #ffd84d; border: 2px solid #ffd84d; box-shadow: none; }
  #menu .fine { font-size: 12px; color: #9fb6c4; }
  #topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    align-items: flex-start; padding: 14px 18px; gap: 16px; }
  #missionBox { background: rgba(6,20,30,.72); border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
    padding: 10px 14px; max-width: 520px; }
  #missionBox b { display: block; font-size: 14px; color: #ffd84d; letter-spacing: .5px; }
  #missionBox span { font-size: 13px; line-height: 1.4; color: #e8eef2; }
  #rightBox { text-align: right; background: rgba(6,20,30,.72); border: 1px solid rgba(255,255,255,.25);
    border-radius: 10px; padding: 10px 14px; }
  #stars { font-size: 22px; letter-spacing: 3px; color: #fff; }
  #cash { font-size: 22px; font-weight: 800; color: #7dff9b; }
  #bottombar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
    align-items: flex-end; padding: 14px 18px; gap: 16px; }
  #vitals { display: flex; flex-direction: column; gap: 8px; width: 300px; }
  .bar { position: relative; height: 22px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35);
    border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: #37c978; }
  .bar span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; letter-spacing: 2px; }
  #carBox { display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: rgba(6,20,30,.72); border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 8px 18px; }
  #speedText { font-size: 26px; font-weight: 800; }
  #radioText { font-size: 12px; color: #bfe3ff; }
  #minimap { border: 2px solid rgba(255,255,255,.7); border-radius: 8px; background: #0c1c26;
    box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 26px; font-weight: 700; color: rgba(255,255,255,.9); text-shadow: 0 0 6px #000; }
  #toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); background: rgba(6,20,30,.85);
    border: 1px solid #ffd84d; color: #ffe9a8; padding: 10px 18px; border-radius: 10px; font-size: 15px;
    opacity: 0; transition: opacity .25s; max-width: 640px; text-align: center; }
  #toast.show { opacity: 1; }
  #hint { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: rgba(0,0,0,.7);
    padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .25s; }
  #hint.show { opacity: 1; }
  #centerMsg { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); font-size: 34px;
    font-weight: 900; letter-spacing: 2px; color: #ffd84d; text-align: center;
    text-shadow: 0 3px 0 #000, 0 6px 24px rgba(0,0,0,.8); max-width: 80%; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
